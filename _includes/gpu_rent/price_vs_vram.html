<!-- Price against VRAM on one GPU, with the cheapest offer at or above each capacity.
     Data comes from _data/gpu_rent.json, inlined by Liquid when the site is built. -->
<div id="gpu-price-vs-vram" style="height: 480px"></div>

<script>
/* Load Highcharts once, however many of these figures the page includes. */
window.gpuHighcharts = window.gpuHighcharts || new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/highcharts@12.4.0/highcharts.js';
    s.onload = resolve;
    s.onerror = function () { reject(new Error('cannot load Highcharts')); };
    document.head.appendChild(s);
});
</script>

<script>
window.gpuHighcharts.then(function () {

const DATA = {{ site.data.gpu_rent | jsonify }};

const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const MONO = 'ui-monospace, "SFMono-Regular", Consolas, monospace';
const T = {
    ink: '#111111', ink2: '#555555', ink3: '#828282',
    rule: '#d5d5d5', rule2: '#ececec', surface: '#fdfdfd',
    vast: '#2a78d6', runpod: '#eb6834', autodl: '#1baf7a',
};
const KEYS = [
    { key: 'vast_ai:ondemand', label: 'vast.ai',          symbol: 'circle',  hollow: false },
    { key: 'runpod:community', label: 'RunPod community', symbol: 'square',  hollow: true  },
    { key: 'runpod:secure',    label: 'RunPod secure',    symbol: 'square',  hollow: false },
    { key: 'autodl:listed',    label: 'AutoDL',           symbol: 'diamond', hollow: false },
];

const HUES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
const money = v => '$' + v.toFixed(2);

function fade(hex, onto, k) {
    const parts = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const [r1, g1, b1] = parts(hex), [r2, g2, b2] = parts(onto);
    const c = (a, b) => Math.round(a + (b - a) * k).toString(16).padStart(2, '0');
    return '#' + c(r1, r2) + c(g1, g2) + c(b1, b2);
}

/* Every card has a VRAM figure, so unlike the throughput figure this one covers the whole
   snapshot. With 23 cards there is no honest way to give each its own hue, so this is emphasis
   instead: the dominated offers recede to one neutral, and the frontier keeps the market symbols,
   because "which is the cheapest 80 GB" is only actionable once you know where to rent it. */
const marks = [];
for (const g of DATA.gpus) {
    for (const spec of KEYS) {
        const s = g.series[spec.key];
        if (s && s.min != null) marks.push({ x: s.min, y: g.vram, card: g.name, spec });
    }
}

const dominated = m => marks.some(o => o.x <= m.x && o.y >= m.y && (o.x < m.x || o.y > m.y));
const live = marks.filter(m => !dominated(m)).sort((a, b) => a.x - b.x || b.y - a.y);
const dim = marks.filter(dominated);

const xs = marks.map(m => m.x), ys = marks.map(m => m.y);
const xFloor = Math.min(...xs) / 1.4, xCeil = Math.max(...xs) * 1.4;
const yFloor = Math.min(...ys) / 1.5, yCeil = Math.max(...ys) * 1.5;
const xTicks = [0.2, 0.3, 0.5, 1, 2, 3, 5, 10, 20].filter(v => v >= xFloor && v <= xCeil);
const yTicks = [24, 32, 48, 64, 96, 144, 192, 288].filter(v => v >= yFloor && v <= yCeil);

/* Several cards can be non-dominated at effectively one spot: both 4090s are 24 GB on the same
   AutoDL listing, and the two H200s are 141 vs 143 GB a few cents apart. Near neighbours become
   one rung, with one label, one colour and one legend entry. */
const spots = [];
for (const m of live) {
    const near = spots.find(s => Math.abs(Math.log10(s.x / m.x)) < 0.09
                              && Math.abs(Math.log10(s.y / m.y)) < 0.035);
    if (near) {
        if (!near.names.includes(m.card)) near.names.push(m.card);
        near.marks.push(m);
    } else {
        spots.push({ x: m.x, y: m.y, names: [m.card], marks: [m], spec: m.spec });
    }
}

/* Name a rung by the words its cards share plus what differs, so two entries do not read as two
   findings: "RTX 4090" and "RTX 4090 D" become "RTX 4090 (D)", "H200 SXM" and "H200 NVL" become
   "H200 SXM / NVL". */
function rungName(names) {
    if (names.length === 1) return names[0];
    const words = names.map(n => n.split(' '));
    let i = 0;
    while (i < words[0].length && words.every(w => w[i] === words[0][i])) i++;
    const stem = words[0].slice(0, i).join(' ');
    if (!stem) return names.join(' / ');
    const rest = words.map(w => w.slice(i).join(' '));
    const extra = rest.filter(Boolean);
    if (!extra.length) return stem;
    // One card is the other plus a suffix, e.g. the D editions.
    return rest.some(r => !r) ? stem + ' (' + extra.join('/') + ')'
                             : stem + ' ' + extra.join(' / ');
}

/* Extra leftward shift, in pixels, for the labels that would otherwise sit on their own mark or
   on the frontier's riser. Hand-tuned against the plot, hence by name. */
const NUDGE = {
    'RTX 4090 (D)':   -24,
    'A800 80GB':      -18,
    'H200 SXM / NVL': -18,
};

const closed = [[live[0].x, yFloor], ...live.map(m => [m.x, m.y]),
                [xCeil, live[live.length - 1].y]];
const dimCol = fade(T.ink2, T.surface, 0.68);

const series = [
    { type: 'line', name: 'Cheapest at each capacity', data: closed, step: 'left',
      color: T.ink2, lineWidth: 2, dashStyle: 'ShortDot', marker: { enabled: false },
      enableMouseTracking: false, zIndex: 1 },
    { type: 'scatter', name: 'dominated', color: dimCol, zIndex: 2,
      marker: { symbol: 'circle', radius: 4, fillColor: dimCol, lineWidth: 0 },
      data: dim.map(m => ({ x: m.x, y: m.y, card: m.card, market: m.spec.label, live: false })) },
    { type: 'scatter', marker: { enabled: false }, enableMouseTracking: false,
      showInLegend: false, zIndex: 4,
      data: spots.map(function (s) {
          /* Explicit tickPositions make Highcharts clamp the axis to its last tick, so the
             roomiest card sits hard against the top of the plot and a label above it lands
             outside the container. Hang the top rung under its mark instead. */
          const roomAbove = s.y < Math.max(...spots.map(p => p.y)) / 1.05;
          const label = rungName(s.names);
          return {
              x: s.x, y: s.y,
              dataLabels: {
                  enabled: true, allowOverlap: false, crop: false, overflow: 'allow',
                  align: 'left', x: -34 + (NUDGE[label] || 0),
                  verticalAlign: roomAbove ? 'bottom' : 'top', y: roomAbove ? -9 : 9,
                  backgroundColor: T.surface, borderWidth: 0, padding: 3,
                  format: label,
                  style: { color: T.ink2, fontSize: '11px', fontWeight: '400', textOutline: 'none' },
              },
          };
      }) },
    /* One series per rung of the frontier, named for the card that holds it. Hue carries the
       card; the marker shape still repeats the first figure's markets, so where to rent it
       survives. */
    ...spots.map(function (s, i) {
        const hue = HUES[i % HUES.length];
        return {
            type: 'scatter', name: rungName(s.names), color: hue, zIndex: 3,
            marker: s.spec.hollow
                ? { symbol: s.spec.symbol, radius: 6, fillColor: T.surface, lineColor: hue, lineWidth: 2 }
                : { symbol: s.spec.symbol, radius: 6, fillColor: hue, lineColor: T.surface, lineWidth: 1.5 },
            data: s.marks.map(m => ({ x: m.x, y: m.y, card: m.card, market: m.spec.label, live: true })),
        };
    }),
];

Highcharts.chart('gpu-price-vs-vram', {
    chart: {
        height: 480, marginRight: 40, backgroundColor: 'transparent',
        style: { fontFamily: FONT }, spacing: [14, 14, 10, 6],
    },
    title: { text: undefined },
    credits: { enabled: false },
    accessibility: { enabled: false },
    legend: {
        itemStyle: { color: T.ink2, fontWeight: '400', fontSize: '12px' },
        itemHoverStyle: { color: T.ink }, symbolPadding: 6, margin: 18,
    },
    xAxis: {
        type: 'logarithmic',
        title: { text: 'USD per GPU-hour', style: { color: T.ink3, fontSize: '11px' } },
        min: xFloor, max: xCeil, lineColor: T.rule, tickWidth: 0,
        gridLineColor: T.rule2, gridLineWidth: 1, tickPositions: xTicks.map(Math.log10),
        labels: {
            formatter() { return '$' + (this.value < 1 ? this.value.toFixed(2) : this.value); },
            style: { color: T.ink3, fontSize: '11px', fontFamily: MONO },
        },
    },
    yAxis: {
        type: 'logarithmic',
        title: { text: 'VRAM on one GPU, GB', style: { color: T.ink3, fontSize: '11px' } },
        min: yFloor, max: yCeil, gridLineColor: T.rule2, tickPositions: yTicks.map(Math.log10),
        labels: {
            formatter() { return this.value; },
            style: { color: T.ink3, fontSize: '11px', fontFamily: MONO },
        },
    },
    tooltip: {
        backgroundColor: '#ffffff', borderColor: T.rule, borderRadius: 2, shadow: false,
        useHTML: true, style: { color: T.ink, fontSize: '12px', fontFamily: MONO },
        formatter() {
            const p = this.point;
            return '<b>' + p.card + '</b> &middot; ' + p.market + '<br>'
                   + money(p.x) + ' per GPU-hour<br>'
                   + p.y + ' GB &middot; ' + (p.y / p.x).toFixed(0) + ' GB per $/hour'
                   + (p.live ? '<br><b>cheapest at this capacity</b>' : '<br>dominated');
        },
    },
    series,
});

});
</script>
