<!-- Cheapest price per GPU-hour on each market, one row per card, dearest card on top.
     Data comes from _data/gpu_rent.json, inlined by Liquid when the site is built. -->
<div id="gpu-price-by-market" style="height: 780px"></div>

<script>
/* Load Highcharts once, however many of these figures the page includes. */
window.gpuHighcharts = window.gpuHighcharts || new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/highcharts@12.4.0/highcharts.js';
    s.onload = resolve;
    s.onerror = function () { reject(new Error('cannot load Highcharts')); };
    document.head.appendChild(s);
});
</script>

<script>
window.gpuHighcharts.then(function () {

const DATA = {{ site.data.gpu_rent | jsonify }};

const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const MONO = 'ui-monospace, "SFMono-Regular", Consolas, monospace';
const T = {
    ink: '#111111', ink2: '#555555', ink3: '#828282',
    rule: '#d5d5d5', rule2: '#ececec', surface: '#fdfdfd',
    vast: '#2a78d6', runpod: '#eb6834', autodl: '#1baf7a',
};

const KEYS = [
    { key: 'vast_ai:ondemand', label: 'vast.ai',          colour: T.vast,   symbol: 'circle',  hollow: false },
    { key: 'runpod:community', label: 'RunPod community', colour: T.runpod, symbol: 'square',  hollow: true  },
    { key: 'runpod:secure',    label: 'RunPod secure',    colour: T.runpod, symbol: 'square',  hollow: false },
    { key: 'autodl:listed',    label: 'AutoDL',           colour: T.autodl, symbol: 'diamond', hollow: false },
];
const COUNTING = ['vast_ai:ondemand', 'autodl:listed'];  // the two that report GPU counts

const money = v => '$' + v.toFixed(2);

/* Cards ordered dearest first, so the ladder reads top to bottom. */
const cheapestOf = g => {
    const vals = Object.values(g.series).map(s => s.min).filter(v => v != null);
    return vals.length ? Math.min(...vals) : null;
};
const priced = DATA.gpus.filter(g => cheapestOf(g) != null)
                        .sort((a, b) => cheapestOf(b) - cheapestOf(a));

function marker(spec) {
    return spec.hollow
        ? { symbol: spec.symbol, radius: 5, fillColor: T.surface, lineColor: spec.colour, lineWidth: 2 }
        : { symbol: spec.symbol, radius: 5, fillColor: spec.colour, lineColor: T.surface, lineWidth: 1.5 };
}

/* The faint bar behind each mark: cheapest to dearest offer on the same market. */
const spreads = COUNTING.map(function (k) {
    const pts = [];
    priced.forEach(function (g, i) {
        const s = g.series[k];
        if (!s || !s.levels || s.levels.length < 2) return;
        pts.push({ x: i, y: s.levels[0][0] },
                 { x: i, y: s.levels[s.levels.length - 1][0] },
                 { x: i, y: null });
    });
    return {
        type: 'line', name: 'spread', data: pts, lineWidth: 2, opacity: 0.3,
        color: k.startsWith('vast') ? T.vast : T.autodl,
        marker: { enabled: false }, enableMouseTracking: false, showInLegend: false,
        connectNulls: false, states: { inactive: { opacity: 0.3 } },
    };
});

const dots = KEYS.map(spec => ({
    type: 'scatter', name: spec.label, color: spec.colour, marker: marker(spec),
    data: priced.map(function (g, i) {
        const s = g.series[spec.key];
        return (s && s.min != null)
            ? { x: i, y: s.min, gpu: g.name, med: s.median, avail: s.available,
                max: s.levels ? s.levels[s.levels.length - 1][0] : null }
            : null;
    }).filter(Boolean),
}));

Highcharts.chart('gpu-price-by-market', {
    chart: {
        inverted: true, height: 780, backgroundColor: 'transparent',
        style: { fontFamily: FONT }, spacing: [14, 14, 10, 6],
    },
    title: { text: undefined },
    credits: { enabled: false },
    accessibility: { enabled: false },
    legend: {
        itemStyle: { color: T.ink2, fontWeight: '400', fontSize: '12px' },
        itemHoverStyle: { color: T.ink }, symbolPadding: 6, margin: 18,
    },
    xAxis: {
        categories: priced.map(g => g.name),
        lineColor: T.rule, tickWidth: 0, gridLineWidth: 0,
        labels: { style: { color: T.ink2, fontSize: '12px' } },
    },
    yAxis: {
        type: 'logarithmic', min: 0.25, max: 11, title: { text: 'USD per GPU-hour', style: { color: T.ink3, fontSize: '11px' } },
        gridLineColor: T.rule2, gridLineWidth: 1, lineWidth: 0,
        /* On a log axis Highcharts reads tickPositions in log space, not in axis values. */
        tickPositions: [0.25, 0.5, 1, 2, 5, 10].map(Math.log10),
        labels: {
            formatter() { return '$' + (this.value < 1 ? this.value.toFixed(2) : this.value); },
            style: { color: T.ink3, fontSize: '11px', fontFamily: MONO },
        },
    },
    tooltip: {
        backgroundColor: '#ffffff', borderColor: T.rule, borderRadius: 2, shadow: false, useHTML: true,
        style: { color: T.ink, fontSize: '12px', fontFamily: MONO },
        formatter() {
            const p = this.point;
            const bits = ['<b>' + p.gpu + '</b> &middot; ' + this.series.name, 'cheapest ' + money(p.y)];
            if (p.med != null && p.med !== p.y) bits.push('median ' + money(p.med));
            /* The right-hand end of the bar. Absent when the market lists a single price, where
               repeating the cheapest one as "dearest" would read as a second finding. */
            if (p.max != null && p.max !== p.y) bits.push('dearest ' + money(p.max));
            if (p.avail != null) bits.push(p.avail + ' idle');
            return bits.join('<br>');
        },
    },
    series: [...spreads, ...dots],
});

});
</script>
